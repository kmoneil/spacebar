name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The patch, not the minor. actions/setup-go sets GOTOOLCHAIN=local, so the
  # go command will not fetch what go.mod asks for: it refuses. This has to be
  # the same patch version go.mod names, and internal/lint/goversion_test.go
  # says so.
  #
  # It is not only about whether the build runs. go-licenses decides what is
  # standard library by comparing against the GOROOT compiled into it, so the
  # moment go.mod names a toolchain the runner does not have, GOROOT moves into
  # the module cache, no package looks like stdlib any more, and the licence
  # gate dies with an error that mentions none of this. The Makefile passes the
  # real GOROOT through to survive that; the two numbers still move together.
  GO_VERSION: "1.26.6"

jobs:
  check:
    name: format, vet, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Pinned from the Makefile, on the same argument the steps below already
      # made for themselves: a formatter that floats can fail a pull request
      # that changed nothing, and here it can also fail a release, because the
      # release gate re-runs `make ci` on a tag that cannot be moved.
      # The tools this job installs come from the module proxy, and that is a
      # network call in front of a gate on every run of every pull request. A
      # hit skips it entirely; a miss installs and saves. release.yml has done
      # this since a transient sum.golang.org error killed a release whose tag
      # was already public, and ci.yml did not, until a proxy stream error
      # reddened `main` on 2026-08-20 in the licence gate's first step, before
      # a licence had been looked at.
      #
      # The key carries the job because these jobs install different subsets.
      # release.yml runs `make tools` and one key is right for it; here, a
      # shared key would let a cache saved by one job be restored by another,
      # report a hit, and skip installing a tool that was never in it.
      - name: the pinned tool versions
        id: tools
        run: echo "key=$(make -s tools-key)" >> "$GITHUB_OUTPUT"
      - name: restore the tools
        id: toolcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ci-tools-fmt-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ steps.tools.outputs.key }}
      - name: gofumpt
        if: steps.toolcache.outputs.cache-hit != 'true'
        run: go install mvdan.cc/gofumpt@$(make -s print-GOFUMPT_VERSION)
      - name: fmt-check
        run: make fmt-check
      - name: vet
        run: make vet
      # v8 is the first action release that runs golangci-lint v2, which
      # `.golangci.yml` declares with `version: "2"`, and v9 is the first that
      # runs on Node 24.
      #
      # The version is pinned rather than `latest` because golangci-lint
      # refuses a module whose Go directive is newer than the Go it was itself
      # built with, and `latest` has resolved to a binary built with an older
      # toolchain more than once. A linter that floats is also a linter that
      # can fail a pull request that changed nothing.
      #
      # It is the one tool an action installs rather than `go install`, so its
      # version cannot come from the Makefile the way the others do. It is
      # asserted equal to GOLANGCI_LINT_VERSION by
      # internal/lint/toolversion_test.go instead, since two places declaring
      # one version is exactly the drift these comments keep warning about.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  vuln:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # GO_VERSION is the patch go.mod names, so the scan reports the
          # standard library this build is actually against. Most findings are
          # in the toolchain rather than in anything this module wrote: the
          # toolchain is the exposure.
          go-version: ${{ env.GO_VERSION }}
      # The tools this job installs come from the module proxy, and that is a
      # network call in front of a gate on every run of every pull request. A
      # hit skips it entirely; a miss installs and saves. release.yml has done
      # this since a transient sum.golang.org error killed a release whose tag
      # was already public, and ci.yml did not, until a proxy stream error
      # reddened `main` on 2026-08-20 in the licence gate's first step, before
      # a licence had been looked at.
      #
      # The key carries the job because these jobs install different subsets.
      # release.yml runs `make tools` and one key is right for it; here, a
      # shared key would let a cache saved by one job be restored by another,
      # report a hit, and skip installing a tool that was never in it.
      - name: the pinned tool versions
        id: tools
        run: echo "key=$(make -s tools-key)" >> "$GITHUB_OUTPUT"
      - name: restore the tools
        id: toolcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ci-tools-vuln-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ steps.tools.outputs.key }}
      - name: govulncheck
        if: steps.toolcache.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@$(make -s print-GOVULNCHECK_VERSION)
      - name: make vuln
        run: make vuln

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # internal/lint runs gocognit as a subprocess and fails rather than skips
      # when it is absent, on the argument that a complexity gate which did not
      # run reads exactly like one that passed. That argument only holds if CI
      # installs the tool, so this step is part of the gate and not a
      # convenience.
      # The tools this job installs come from the module proxy, and that is a
      # network call in front of a gate on every run of every pull request. A
      # hit skips it entirely; a miss installs and saves. release.yml has done
      # this since a transient sum.golang.org error killed a release whose tag
      # was already public, and ci.yml did not, until a proxy stream error
      # reddened `main` on 2026-08-20 in the licence gate's first step, before
      # a licence had been looked at.
      #
      # The key carries the job because these jobs install different subsets.
      # release.yml runs `make tools` and one key is right for it; here, a
      # shared key would let a cache saved by one job be restored by another,
      # report a hit, and skip installing a tool that was never in it.
      - name: the pinned tool versions
        id: tools
        run: echo "key=$(make -s tools-key)" >> "$GITHUB_OUTPUT"
      - name: restore the tools
        id: toolcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ci-tools-test-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ steps.tools.outputs.key }}
      - name: gocognit
        if: steps.toolcache.outputs.cache-hit != 'true'
        run: go install github.com/uudashr/gocognit/cmd/gocognit@$(make -s print-GOCOGNIT_VERSION)
      # Everything the run needs has to be on disk before the next step, since
      # after it nothing can be fetched. setup-go sets GOTOOLCHAIN=local, so
      # the toolchain is already settled; this is the module cache.
      #
      # `download all` rather than `download`, and the `go list` after it is not
      # a belt on a brace. TestNoDependencyShipsANotice shells out to
      # `go list -m -f '{{.Path}}\t{{.Dir}}' all`, which needs the whole module
      # graph resolved and every module in it extracted, so it reaches the
      # network when the cache holds only what the build imports. That is what
      # the first run of this step found, and it is the kind of thing the step
      # exists to find: a test nobody thought was talking to anybody.
      - name: fill the module cache
        run: |
          go mod download all
          go list -m all > /dev/null
      # The tests run in a network namespace with nothing in it but loopback,
      # which is the second half of "a test never talks to anybody".
      #
      # internal/lint/hosts_test.go reads every URL literal in every test file
      # and requires a reserved TLD, a loopback address, or an entry saying why
      # that host is only ever parsed. That catches the realistic accident, a
      # real URL pasted into a new fixture, and it catches it on the machine
      # the test was written on. What it cannot see is an address built at run
      # time, or a request a dependency makes on our behalf: x/oauth2 builds
      # the token request itself and no literal here names the host it goes to.
      #
      # SECURITY.md claimed this step for several milestones before it existed.
      # It exists now, and the claim names the job it covers rather than "CI",
      # because the release gate runs `make ci`, which includes `make vuln`,
      # and govulncheck has to reach vuln.go.dev.
      #
      # It is a namespace and not a firewall rule, and that is the whole point
      # of this step rather than a preference. The first attempt was
      #
      #     sudo iptables -A OUTPUT -o lo -j ACCEPT
      #     sudo iptables -A OUTPUT        -j REJECT
      #
      # which blocks the runner agent along with the tests. The agent holds its
      # own connection to GitHub to stream logs and report step results, so the
      # job died with "The hosted runner lost communication with the server",
      # no logs and no step conclusions, after forty-five minutes of looking
      # like a hang rather than a failure. A namespace contains the process
      # under test and leaves the agent where it was, which is the distinction
      # a rule on the OUTPUT chain cannot make.
      #
      # `make test` is -race, and so deliberately not CGO_ENABLED=0: the race
      # detector needs cgo. The shipped binary is built without it, see the
      # Makefile, but a test run that cannot see a data race is worth less than
      # the symmetry costs.
      #
      # Loopback is brought up because the tests are full of httptest servers.
      # The proof fetch runs inside the namespace and must fail: a namespace
      # that still had a route out would leave this job proving nothing, and
      # reading exactly like one that proved something. The script is built by
      # the outer shell so that PATH and HOME reach `make test` as the runner
      # user, which sudo would otherwise reset to root's.
      - name: test with no network
        run: |
          cat > /tmp/no-network.sh <<SH
          #!/bin/sh
          set -e
          ip link set lo up
          if ! command -v curl > /dev/null; then
            echo "curl is not installed, so the egress proof cannot run"
            exit 1
          fi
          if curl -sS --max-time 10 https://proxy.golang.org/ > /dev/null 2>&1; then
            echo "the namespace has a route out, so this job would prove nothing"
            exit 1
          fi
          exec sudo -u runner env "PATH=$PATH" "HOME=$HOME" make test
          SH
          chmod +x /tmp/no-network.sh
          sudo unshare --net /tmp/no-network.sh

  licensing:
    name: licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # The tools this job installs come from the module proxy, and that is a
      # network call in front of a gate on every run of every pull request. A
      # hit skips it entirely; a miss installs and saves. release.yml has done
      # this since a transient sum.golang.org error killed a release whose tag
      # was already public, and ci.yml did not, until a proxy stream error
      # reddened `main` on 2026-08-20 in the licence gate's first step, before
      # a licence had been looked at.
      #
      # The key carries the job because these jobs install different subsets.
      # release.yml runs `make tools` and one key is right for it; here, a
      # shared key would let a cache saved by one job be restored by another,
      # report a hit, and skip installing a tool that was never in it.
      - name: the pinned tool versions
        id: tools
        run: echo "key=$(make -s tools-key)" >> "$GITHUB_OUTPUT"
      - name: restore the tools
        id: toolcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ci-tools-licence-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ steps.tools.outputs.key }}
      - name: install the licence tools
        if: steps.toolcache.outputs.cache-hit != 'true'
        run: |
          go install github.com/google/go-licenses@$(make -s print-GOLICENSES_VERSION)
          go install github.com/google/addlicense@$(make -s print-ADDLICENSE_VERSION)
      # SPEC.md §2.1. Runs over every platform, because the dependency graph is
      # not the same on all of them and a forbidden licence that only appears
      # in the Windows build is one that ships.
      - name: every dependency's licence is on the allowlist
        run: make license-check
      - name: every .go file carries its header
        run: make license-headers-check
      # A dependency can be added without regenerating the notices, and the
      # binary would then ship claiming a set of licences that is not the set
      # it is subject to. Regenerating here and diffing is the only way to
      # notice.
      - name: THIRD_PARTY_LICENSES is current
        run: |
          make licenses
          if ! git diff --exit-code --stat -- THIRD_PARTY_LICENSES NOTICE; then
            echo
            echo "The dependency set changed but the notices were not regenerated."
            echo "Run 'make licenses', and update NOTICE in the same commit."
            exit 1
          fi

  contract:
    name: output contract is unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # The golden files are the public output contract, and an agent parsing
      # --json is a consumer we never hear from until we break it. A diff here
      # is a diff every caller sees, so it must be committed deliberately and
      # never regenerated by CI.
      - name: regenerate goldens
        run: make golden
      - name: fail if the contract drifted
        run: |
          if ! git diff --exit-code --stat; then
            echo
            echo "The output contract changed but the golden files were not updated."
            echo "Run 'make golden' and read every diff before committing it."
            exit 1
          fi

  build:
    name: cross-compile every platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # SPEC.md §1 requires CGO_ENABLED=0 across linux, darwin, and windows on
      # both architectures. Finding out on a tag that one of the six does not
      # compile is the expensive way to learn it, and the release workflow
      # cannot be re-run against a moved tag.
      - name: build every platform
        run: make build-all
      - name: the binary reports its own identity
        run: |
          make build
          ./bin/spacebar version --json | jq -e '.name == "spacebar"'
          ./bin/spacebar licenses | head -1
          ./bin/spacebar completion bash > /dev/null
