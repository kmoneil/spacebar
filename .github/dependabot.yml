version: 2

updates:
  # Go modules. The list is deliberately short (SPEC.md §3.1 permits five
  # direct dependencies and names the reason each one earns its place), so a
  # bump here is a real event rather than noise, and grouping them would hide
  # which one moved.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    commit-message:
      # Conventional Commits, because the pre-commit hook checks the header
      # shape and a PR whose commit cannot land is a PR nobody can merge.
      prefix: "chore(deps)"
    labels:
      - dependencies

  # The workflows pin actions by commit SHA, so this is what moves them, and it
  # rewrites the trailing version comment along with the ref. That comment is
  # load-bearing for the same reason: without it a pin is forty hex digits and
  # nobody can tell a current one from a two-year-old one.
  # internal/lint/actionpin_test.go refuses a tag and refuses a SHA with no
  # comment, so neither can come back by hand.
  #
  # Kept separate from gomod on purpose: an action bump changes what CI does,
  # a module bump changes what ships, and reviewing them together invites
  # waving through the half you did not read.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - ci
    # Grouped, unlike gomod above, and for the reason gomod is not: these move
    # together. Seven actions across three workflow files, and the ruleset
    # requires a branch to be current before it merges, so ungrouped the first
    # merge leaves the rest behind and every rebase re-runs six checks to
    # change one ref.
    #
    # That is the reason and not a report. This comment was written with the
    # config on 2026-08-14, before Dependabot had ever run, and no action bump
    # has been produced since, because every pin is at its latest major. So the
    # grouping has never been exercised. An earlier version of this said the
    # four pull requests had happened; they had not, and the pull request list
    # says so.
    #
    # A module bump changes what ships and deserves its own review; an action
    # bump changes what CI does, and CI either runs or it does not.
    groups:
      actions:
        patterns:
          - "*"
